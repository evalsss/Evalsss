<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>evalsss | Links</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --telegram-color: #24A1DE;
            --twitch-color: #9146FF;
            --donatepay-color: #FF8A00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(36, 161, 222, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(145, 70, 255, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .header {
            text-align: center;
        }

        .profile-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .profile-subtitle {
            color: var(--subtext-color);
            font-size: 0.95rem;
        }

        .icons-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
            width: 100%;
        }

        /* Карточка ровно 3 см x 3 см */
        .icon-card {
            width: 3cm;
            height: 3cm;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .icon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .icon-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .icon-card:hover::before {
            opacity: 1;
        }

        .icon-card.telegram:hover {
            box-shadow: 0 15px 35px -5px rgba(36, 161, 222, 0.4);
            border-color: var(--telegram-color);
        }

        .icon-card.twitch:hover {
            box-shadow: 0 15px 35px -5px rgba(145, 70, 255, 0.4);
            border-color: var(--twitch-color);
        }

        .icon-card.donatepay:hover {
            box-shadow: 0 15px 35px -5px rgba(255, 138, 0, 0.4);
            border-color: var(--donatepay-color);
        }

        .icon-card svg {
            width: 1.2cm;
            height: 1.2cm;
            transition: transform 0.3s ease;
        }

        .icon-card:hover svg {
            transform: scale(1.1);
        }

        .icon-card .label {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.4rem;
            opacity: 0.9;
            letter-spacing: 0.02em;
        }

        .icon-card.disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.55rem;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--subtext-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .footer {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--subtext-color);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="profile-title">evalsss</h1>
            <p class="profile-subtitle">Мои социальные сети и ссылки</p>
        </header>

        <main class="icons-list">
            <!-- 1. Telegram (Активная ссылка) -->
            <a href="https://t.me/evalsss" target="_blank" rel="noopener noreferrer" class="icon-card telegram" title="Telegram: evalsss">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.75 3.99-1.74 6.66-2.89 8.01-3.46 3.81-1.58 4.6-1.86 5.12-1.87.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.01.22-.04.37z" fill="#24A1DE"/>
                </svg>
                <span class="label">Telegram</span>
            </a>

            <!-- 2. Twitch (Без ссылки) -->
            <div class="icon-card twitch disabled" title="Twitch (скоро)">
                <span class="badge">Скоро</span>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.571 4.714h1.715v5.143h-1.715V4.714zm4.715 0H18v5.143h-1.714V4.714zM6 2L3.429 4.571v14.572h4.714V22h2.572l2.571-2.571h3.429L21 15V2H6zm13.286 12l-2.572 2.571h-4.286l-2.571 2.572v-2.572H6V3.714h13.286V14z" fill="#9146FF"/>
                </svg>
                <span class="label">Twitch</span>
            </div>

            <!-- 3. DonatePay (Без ссылки) -->
            <div class="icon-card donatepay disabled" title="DonatePay (скоро)">
                <span class="badge">Скоро</span>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 7.5H3C2.44772 7.5 2 7.94772 2 8.5V18.5C2 19.0523 2.44772 19.5 3 19.5H21C21.5523 19.5 22 19.0523 22 18.5V8.5C22 7.94772 21.5523 7.5 21 7.5Z" fill="#FF8A00" fill-opacity="0.2" stroke="#FF8A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 13.5C16.8284 13.5 17.5 12.8284 17.5 12C17.5 11.1716 16.8284 10.5 16 10.5C15.1716 10.5 14.5 11.1716 14.5 12C14.5 12.8284 15.1716 13.5 16 13.5Z" fill="#FF8A00"/>
                    <path d="M5 7.5V5.5C5 4.94772 5.44772 4.5 6 4.5H18C18.5523 4.5 19 4.94772 19 5.5V7.5" stroke="#FF8A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="label">DonatePay</span>
            </div>
        </main>

        <footer class="footer">
            © 2026 evalsss
        </footer>
    </div>

</body>
</html>
